<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">

<!-- ============================================================
     栄光見積 － 入口ページ
     有限会社栄光重機

     【このページの役目】
     ホーム画面のアイコンの絵と名前を持たせるためのページ。
     iPhoneは「ホーム画面に追加」した時点のページから絵と名前を読むので、
     アイコンを持たせるにはこのページが要る。

     【ふだんの動き】
     アイコンをタップ → このページが一瞬出て → そのまま見積画面へ自動で進む。
     待たせないよう、すぐに飛ばしている。

     【ホーム画面に追加し直したいとき】
     住所のうしろに ?setup を付けて開くと、ここで止まる。
       https://anakagawaeikou-eng.github.io/eikou-mitsumori/?setup
     止まった状態で「共有 → ホーム画面に追加」すれば、
     この絵と名前でアイコンが作られる。

     【なぜ画面を埋め込まないか】
     iPhoneのSafariは「クロスサイトトラッキングを防ぐ」が標準でON。
     別サイトの画面を枠の中に埋め込むとCookieが送られず、
     Googleが 401 エラーを返す（実機で確認済み）。
     埋め込みではなく普通の移動にすれば、Cookieは通る。
     ============================================================ -->

<title>見積 栄光重機</title>
<meta name="apple-mobile-web-app-title" content="見積 栄光重機">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B6B3A">

<style>
  :root{
    --green:#1B6B3A;
    --green-dark:#14512C;
    --line:rgba(255,255,255,.25);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--green);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }

  /* 画面ぜんぶがボタン。自動で進まなかったときも、どこを押せば開く。 */
  a.open{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-decoration:none;
    color:inherit;
    transition:background .12s;
  }
  a.open:active{ background:var(--green-dark); }

  .icon img{ width:112px; height:112px; border-radius:26px; display:block; box-shadow:0 8px 24px rgba(0,0,0,.25); }

  h1{ margin:22px 0 6px; font-size:30px; font-weight:700; letter-spacing:.06em; }
  .sub{ margin:0 0 30px; font-size:14px; opacity:.85; }

  /* ひらいている最中の表示 */
  .loading{
    display:flex; align-items:center; gap:10px;
    font-size:16px; font-weight:600; opacity:.9;
  }
  .spin{
    width:18px; height:18px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  /* 自動で進まないとき（?setup を付けたとき）に出す案内 */
  .tap{
    border:2px solid var(--line);
    border-radius:999px;
    padding:15px 34px;
    font-size:18px;
    font-weight:700;
  }
  .hint{ margin-top:18px; font-size:13px; opacity:.75; line-height:1.7; text-align:center; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- 見積画面のURL。作り直したときは、この href だけ差し替える。 -->
<a class="open" id="go"
   href="https://script.google.com/macros/s/AKfycbyo_cFu6VH3Avq9aYEGuvZyJOLjjk8JyYQ1rMmDq4ByQjhJn4OUSfu2nr320g2jHJzHwg/exec?page=quick">

  <span class="icon"><img src="icon-180.png" alt="栄光見積"></span>

  <h1>栄光見積</h1>
  <p class="sub">有限会社栄光重機</p>

  <!-- ふだんはこちらが出る -->
  <span class="loading" id="loading"><span class="spin"></span>ひらいています…</span>

  <!-- ?setup を付けたときだけ出る -->
  <span class="tap hidden" id="tap">画面をタップしてひらく</span>
  <p class="hint hidden" id="hint">
    この画面のまま<br>
    共有ボタン → ホーム画面に追加
  </p>

</a>

<script>
(function () {
  var a = document.getElementById('go');

  // 住所に ?setup が付いているときは、ここで止まる。
  // ホーム画面にアイコンを作り直すためのモード。
  var setup = /[?&]setup(=|&|$)/.test(location.search);

  if (setup) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('tap').classList.remove('hidden');
    document.getElementById('hint').classList.remove('hidden');
    return;
  }

  // ふだんは、そのまま見積画面へ進む。
  // replace を使うと履歴に残らないので、
  // 見積画面で「戻る」を押してもこの画面には戻らない。
  try {
    location.replace(a.href);
  } catch (e) {
    // 万一進めなくても、画面のどこかを押せば開ける
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('tap').classList.remove('hidden');
  }
})();
</script>

</body>
</html>
