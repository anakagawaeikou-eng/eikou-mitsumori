<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>見積 栄光重機</title>

<!-- ホーム画面のアイコンと名前。ここはこちらで自由に決められる -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="見積 栄光重機">
<meta name="application-name" content="見積 栄光重機">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#007C47">
<link rel="manifest" href="manifest.json">

<style>
  html, body { margin:0; padding:0; height:100%; background:#007C47; overscroll-behavior:none; }
  iframe { display:block; width:100%; height:100%; border:0; }
  #fallback {
    display:none; padding:28px 22px; color:#fff; font-size:16px; line-height:1.9;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  #fallback a {
    display:block; margin-top:18px; padding:16px; background:#fff; color:#007C47;
    border-radius:10px; text-align:center; font-weight:700; text-decoration:none;
  }
</style>
</head>
<body>

<!-- 見積の画面をそのまま表示する -->
<iframe id="app"
        src="https://script.google.com/macros/s/AKfycbyo_cFu6VH3Avq9aYEGuvZyJOLjjk8JyYQ1rMmDq4ByQjhJn4OUSfu2nr320g2jHJzHwg/exec?page=quick"
        allow="clipboard-write"></iframe>

<!-- 埋め込みが表示できなかったときの逃げ道 -->
<div id="fallback">
  画面を読み込めませんでした。<br>
  下のボタンから直接開いてください。
  <a href="https://script.google.com/macros/s/AKfycbyo_cFu6VH3Avq9aYEGuvZyJOLjjk8JyYQ1rMmDq4ByQjhJn4OUSfu2nr320g2jHJzHwg/exec?page=quick">
    見積の画面を開く
  </a>
</div>

<script>
// 5秒たっても中身が出ないときだけ、逃げ道を出す
setTimeout(function () {
  var f = document.getElementById('app');
  var ok = false;
  try { ok = !!(f.contentWindow && f.contentWindow.length >= 0); } catch (e) { ok = true; }
  if (!ok) {
    f.style.display = 'none';
    document.getElementById('fallback').style.display = 'block';
  }
}, 5000);
</script>
</body>
</html>
